# Configuration example for Home Assistant
# Use MQTT expolrer to get the ID number for you init and change "Batrium/<YOUR ID> all the lines below"
# I.e  Batrium/6041/3233
# And add 
# mqtt: !include MQTT.yaml
# to you Home assistant configuration.yaml
# This enable support two Batrium controllers so most people will onlt need 1/2 of this file.

  - sensor:
      name: "Batrium Min Cell Volt"
      state_topic: "Batrium/6041/3233"
      value_template: "{{ value_json.MinCellVolt }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
  - sensor:
      name: "Batrium Max Cell Volt"
      state_topic: "Batrium/6041/3233"
      value_template: "{{ value_json.MaxCellVolt }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
  - sensor:
      name: "Batrium Min Cell Temp"
      state_topic: "Batrium/6041/3233"
      value_template: "{{ value_json.MinCellTemp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
  - sensor:
      name: "Batrium Max Cell Temp"
      state_topic: "Batrium/6041/3233"
      value_template: "{{ value_json.MaxCellTemp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
  - sensor:
